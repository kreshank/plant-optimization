calendar:
  operating_days: [mon]
  day_open_time: "07:00"
  wash_cutoff_time: "18:00"
  breaks: []

items_per_truck: 10

resources:
  washers:
    - id: washer_a
      cycle_minutes: 10
      capacity_items: 10
      count: 1

stages:
  scan_in:
    enabled: true
    workers: 2
    service_time_seconds: 6
  separation:
    workers: 2
    service_time_seconds: 4
  steam_tunnel:
    throughput_items_per_hour: 120
  jacket_press:
    workers: 1
    service_time_seconds: 12
  general_press:
    workers: 2
    throughput_items_per_hour: 60
    requires_scan: false
  final_qc:
    workers: 2
    service_time_seconds: 3
    defect_rate: 0.0
  spotting:
    workers: 1
    service_time_seconds: 20
  delivery_scan:
    enabled: true
    workers: 2
    service_time_seconds: 2
  outbound_scan:
    enabled: true
    workers: 2
    service_time_seconds: 2

scan_seconds_per_item: 0

routing:
  after_separation:
    pct_spotting: 0
    pct_steam_tunnel: 0
    pct_jacket_press: 0
    pct_general_press: 100
  after_steam:
    pct_needs_press: 0

transfers: {}

wip:
  initial_by_stage: {}

policies:
  staffing_rules: []
  qc_rework:
    max_cycles: 2
  wash_batching:
    start_when_full_or_idle: true
    allow_partial_load: true
  wash_cutoff:
    defer_to: next_day_open
  outbound_delivery:
    mode: end_of_day_cohort

loss_model:
  base_rate: 0.0
  coverage: 0.0
  effectiveness: 0.0

labor:
  rates_by_role: {}

inputs:
  truck_schedule: tests/fixtures/tiny_truck.csv

objectives:
  simulation_days: 1

optimization:
  bounds: {}
