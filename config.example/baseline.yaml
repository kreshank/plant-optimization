calendar:
  operating_days: [mon, tue, wed, thu, fri, sat]
  day_open_time: "07:00"
  wash_cutoff_time: "17:00"
  breaks: []

items_per_truck: 1

resources:
  washers:
    - id: washer_a
      cycle_minutes: 60
      capacity_items: 100
      count: 1

stages:
  scan_in:
    enabled: true
    workers: 1
    service_time_seconds: 1
  separation:
    workers: 1
    service_time_seconds: 1
  steam_tunnel:
    throughput_items_per_hour: 1
    post_check_seconds: 0
  jacket_press:
    workers: 1
    service_time_seconds: 1
  general_press:
    workers: 1
    throughput_items_per_hour: 1
  final_qc:
    workers: 1
    service_time_seconds: 1
    defect_rate: 0
  spotting:
    workers: 1
    service_time_seconds: 1
  delivery_scan:
    enabled: true
    workers: 1
    service_time_seconds: 1
  outbound_scan:
    enabled: true
    workers: 1
    service_time_seconds: 1

scan_seconds_per_item: 0

routing:
  after_separation:
    pct_spotting: 0
    pct_steam_tunnel: 0
    pct_jacket_press: 0
    pct_general_press: 100
  after_steam:
    pct_needs_press: 0

transfers: {}

wip:
  initial_by_stage: {}

policies:
  wash_batching:
    start_when_full_or_idle: true
    allow_partial_load: true
  wash_cutoff:
    defer_to: next_day_open
  staffing_rules: []
  qc_rework:
    max_cycles: 1
  outbound_delivery:
    mode: end_of_day_cohort

loss_model:
  base_rate: 0
  coverage: 0
  effectiveness: 0

labor:
  rates_by_role: {}

inputs:
  truck_schedule: data/truck_schedule.csv

objectives:
  simulation_days: 1

optimization:
  bounds: {}
