calendar:
  operating_days: [mon, tue, wed, thu, fri, sat]
  day_open_time: "07:00"
  wash_cutoff_time: "18:00"

items_per_truck: 1

resources:
  washers:
    - id: washer_a
      cycle_minutes: 60
      capacity_items: 100
      count: 1

stages:
  scan_in:
    workers:
      normal: 1
      reduced: 1
    service_time_seconds: 1
    labor_role: scan_in
  separation:
    workers: 1
    service_time_seconds: 1
    labor_role: separation
  steam_tunnel:
    throughput_items_per_hour: 1
    labor_role: steam
  jacket_press:
    workers: 1
    service_time_seconds: 1
    labor_role: jacket_press
  general_press:
    workers: 1
    throughput_items_per_hour: 1
    requires_scan: false
    labor_role: press
  final_qc:
    workers: 1
    service_time_seconds: 1
    defect_rate: 0
    labor_role: final_qc
  spotting:
    workers: 1
    service_time_seconds: 1
    labor_role: spotting
  delivery_scan:
    enabled: true
    workers: 1
    service_time_seconds: 1
    labor_role: delivery_scan

scan_seconds_per_item: 0

routing:
  after_separation:
    pct_spotting: 0
    pct_steam_tunnel: 0
    pct_jacket_press: 0
    pct_general_press: 100
  after_steam:
    pct_needs_press: 0

policies:
  wash_batching:
    start_when_full_or_idle: true
    allow_partial_load: true
  wash_cutoff:
    defer_to: next_day_open
  staffing_rules: []
  qc_rework:
    max_cycles: 1
    on_defect_goto: spotting
    then: general_press
  outbound_delivery:
    mode: end_of_day_cohort

loss_model:
  base_rate: 0
  coverage: 0
  effectiveness: 0

labor:
  rates_by_role: {}

economics:
  capex: 0
  opex_annual: 0
  horizon_years: 1

inputs:
  truck_schedule: data/truck_schedule.csv

objectives:
  delivery_ready_deadline: "06:00"
  simulation_days: 1

optimization:
  bounds: {}

sensitivity:
  ranges: {}

constraints: {}
